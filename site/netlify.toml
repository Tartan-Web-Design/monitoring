# Netlify configuration for the MigrateWP static site.
#
# In the Netlify UI, set:
#   Base directory     site        (omit if this folder is the repository root)
#   Build command      (leave empty — there is no build step)
#   Publish directory  .           (or "site" if you did not set a base directory)

[build]
  publish = "."
  command = ""

[build.processing]
  skip_processing = false

# Long-lived caching for fingerprint-free assets is risky, so cache
# moderately and let HTML always revalidate.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self'; img-src 'self' data:; font-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
